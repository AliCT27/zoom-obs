Dialog.Trigger.Auto="Automatic (on click / typing)"
Dialog.AutoHelp="Zooms in by itself when you click or type, and zooms back out after a pause. Nothing to press. The Behavior setting (hold / toggle) is not used in this mode."
Dialog.AutoOnClick="Zoom in on mouse click"
Dialog.AutoOnTyping="Zoom in while typing"
Dialog.AutoOnTypingTooltip="Plain typing counts. Keys pressed together with Ctrl, Alt or Win (shortcuts) are ignored on Windows and macOS."
Dialog.CaretFollow="Follow the text caret while typing"
Dialog.CaretFollowTooltip="While you type, the view follows the blinking text cursor instead of the mouse. Works in apps that report their caret (Notepad, Word, most browser text fields and many editors; Windows only). If an app does not report it, the mouse position is used."
Dialog.ManualZoomIn="Zoom In hotkey"
Dialog.ManualZoomInTooltip="Zooms in right away. Works together with the option above: with automatic zoom out off, the view stays zoomed until you press the Zoom Out hotkey. Optional."
Dialog.ManualZoomOut="Zoom Out hotkey"
Dialog.ManualZoomOutTooltip="Zooms out right away and turns automatic zooming off: clicking and typing will not zoom until you press the Zoom In hotkey (or press Apply). Optional."
Dialog.AutoZoomOut="Zoom out automatically after inactivity"
Dialog.AutoZoomOutTooltip="On: the view zooms back out by itself after the time below. Off: once zoomed in (by click, typing or the Zoom In hotkey) it stays zoomed until you press the Zoom Out hotkey."
Dialog.AutoHold="Zoom out after no activity for"
Dialog.AutoHoldTooltip="How long to stay zoomed after the last click or key press."
Dialog.Easing="Animation Style"
Dialog.Easing.Smooth="Smooth (default)"
Dialog.Easing.EaseOut="Ease out (quick start, soft landing)"
Dialog.Easing.Expo="Expo (sharp snap)"
Dialog.Easing.Punch="Punch (slight overshoot)"
Dialog.EasingTooltip="Shape of the zoom animation. Punch pushes in a little past the target and settles back, which feels snappy in short videos."
Dialog.ReelsPreset="Reels preset"
Dialog.ReelsPresetTooltip="Fills in settings for vertical short-form video: automatic zoom on click/typing, punch animation, canvas fill and cursor halo. Your target screen and source selection are kept."
Dialog.ReelsPresetApplied="Reels preset applied. With Zoom Factor 1.0 the capture just fills the vertical canvas; raise it to push in further."
Dialog.PauseHotkey="Pause / Resume Zoom Hotkey"
Dialog.PauseHotkeyTooltip="Press this key to switch all zooming off or back on, for example while you are talking and do not want the view to move. Works while OBS is in the background."
Dialog.ClearPauseHotkeyTooltip="Clear the pause hotkey"
Dialog.ZoomPaused="Zoom paused. Press the pause hotkey again to resume."
Dialog.ZoomResumed="Zoom resumed."
Dialog.Section.Focus="Focus"
Dialog.FocusEnable="Highlight the area around the cursor (dim and/or blur the rest)"
Dialog.FocusEnableTooltip="While zoomed, darkens the scene around a soft spotlight that follows the cursor. Sources that are not ticked on the Sources tab (a webcam, a logo) stay above the dimming and are not darkened."
Dialog.FocusDim="Dim strength"
Dialog.FocusDimTooltip="How dark the area outside the spotlight gets."
Dialog.FocusRadius="Spotlight radius"
Dialog.FocusRadiusTooltip="Radius of the bright area around the cursor, measured on the canvas."
Dialog.FocusSoftness="Edge softness"
Dialog.FocusSoftnessTooltip="Width of the soft fade between the bright area and the dimmed area."
Dialog.Section.Frame="Frame"
Dialog.FrameEnable="Frame the captured screen (coloured background and glowing border)"
Dialog.FrameEnableTooltip="Colours the area the captured screen does not cover and draws a glowing border along the screen's own edges. The border follows the screen while it zooms and pans (best together with Centre focus). Sources that are not ticked on the Sources tab (a webcam, a logo) stay on top of the frame."
Dialog.FrameColor="Border / glow colour"
Dialog.FrameColorTooltip="Colour of the border and its glow."
Dialog.FrameBg="Background colour"
Dialog.FrameBgTooltip="Colour that fills the black area around the captured screen."
Dialog.FrameBgMode="Background style"
Dialog.FrameBgMode.Solid="Solid colour"
Dialog.FrameBgMode.Linear="Linear gradient"
Dialog.FrameBgMode.Radial="Radial gradient (centre to edges)"
Dialog.FrameBgModeTooltip="Solid fills the background with one colour. Gradients blend from the background colour to the second colour."
Dialog.FrameBg2="Gradient end colour"
Dialog.FrameBg2Tooltip="Second colour of the gradient: the far end for linear, the outer edges for radial."
Dialog.FrameBgAngle="Gradient angle"
Dialog.FrameBgAngleTooltip="Direction of the linear gradient. 0 = left to right, 90 = top to bottom."
Dialog.FrameBorder="Border width"
Dialog.FrameBorderTooltip="Thickness of the solid border. 0 leaves only the glow."
Dialog.FrameRadius="Corner radius"
Dialog.FrameRadiusTooltip="How round the corners of the captured screen's border are. 0 keeps them square."
Dialog.FrameGlow="Glow size"
Dialog.FrameGlowTooltip="How far the glow spreads outside the border. 0 turns the glow off."
Dialog.FrameGlowStrength="Glow strength"
Dialog.FrameGlowStrengthTooltip="Brightness of the glow next to the border."
Dialog.PickFrameColor="Pick colour"
Dialog.FocusStyle="Focus style"
Dialog.FocusStyleTooltip="Dim: darken the area outside the spotlight. Blur: blur it so the eye goes to the cursor. Blur + Dim: both. If the blur shader is not installed, Dim is used instead."
Dialog.FocusStyle.Dim="Dim"
Dialog.FocusStyle.Blur="Blur"
Dialog.FocusStyle.BlurDim="Blur + Dim"
Dialog.FocusBlur="Blur strength"
Dialog.FocusBlurTooltip="How blurry the area outside the spotlight gets, measured on the canvas. Very high values are capped for quality."
