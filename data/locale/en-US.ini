Dialog.Trigger.Auto="Automatic (on click / typing)"
Dialog.AutoHelp="Zooms in by itself when you click or type, and zooms back out after a pause. Nothing to press. The Behavior setting (hold / toggle) is not used in this mode."
Dialog.AutoOnClick="Zoom in on mouse click"
Dialog.AutoOnTyping="Zoom in while typing"
Dialog.AutoOnTypingTooltip="Plain typing counts. Keys pressed together with Ctrl, Alt or Win (shortcuts) are ignored on Windows and macOS."
Dialog.CaretFollow="Follow the text caret while typing"
Dialog.CaretFollowTooltip="While you type, the view follows the blinking text cursor instead of the mouse. Works in apps that report their caret (Notepad, Word, most browser text fields and many editors; Windows only). If an app does not report it, the mouse position is used."
Dialog.FocusWhenNotZoomed="Show focus when not zoomed"
Dialog.FocusWhenNotZoomedTooltip="Also shows the dimmed spotlight around the cursor while the view is not zoomed. Works with the Dim and Blur + Dim styles (only the dimming is shown when not zoomed)."
Dialog.FocusToggleHotkey="Focus on/off hotkey"
Dialog.FocusToggleHotkeyTooltip="Press this key while recording to switch the Focus spotlight on or off. Optional. Apply or restarting OBS returns to the checkbox above."
Dialog.FocusOnHotkey="Focus On hotkey"
Dialog.FocusOnHotkeyTooltip="Switches the Focus spotlight on (and keeps it on). Optional."
Dialog.FocusOffHotkey="Focus Off hotkey"
Dialog.FocusOffHotkeyTooltip="Switches the Focus spotlight off. Optional."
Dialog.ManualZoomIn="Zoom In hotkey"
Dialog.ManualZoomInTooltip="Zooms in right away and stays zoomed until you press the Zoom Out key. Works in every trigger type, so with the Keyboard trigger you can use one key to zoom in and another to zoom out. In Auto mode it also lets clicks and typing zoom again. Optional."
Dialog.ManualZoomOut="Zoom Out hotkey"
Dialog.ManualZoomOutTooltip="Zooms out right away. In Auto mode it also turns automatic zooming off until you press the Zoom In key (or press Apply). Optional."
Dialog.AutoZoomOut="Zoom out automatically after inactivity"
Dialog.AutoZoomOutTooltip="On: the view zooms back out by itself after the time below. Off: once zoomed in (by click, typing or the Zoom In hotkey) it stays zoomed until you press the Zoom Out hotkey."
Dialog.AutoHold="Zoom out after no activity for"
Dialog.AutoHoldTooltip="How long to stay zoomed after the last click or key press."
Dialog.Easing="Animation Style"
Dialog.Easing.Smooth="Smooth (default)"
Dialog.Easing.EaseOut="Ease out (quick start, soft landing)"
Dialog.Easing.Expo="Expo (sharp snap)"
Dialog.Easing.Punch="Punch (slight overshoot)"
Dialog.EasingTooltip="Shape of the zoom animation. Punch pushes in a little past the target and settles back, which feels snappy in short videos."
Dialog.ReelsPreset="Reels preset"
Dialog.ReelsPresetTooltip="Restores the preset you saved with Save my preset. If you have not saved one yet, it fills in settings for vertical short-form video: automatic zoom on click/typing, punch animation, canvas fill and cursor halo. It also fits the whole screen into the canvas width. Your target screen and source selection are kept."
Dialog.ReelsPresetApplied="Reels preset applied. With Zoom Factor 1.0 the capture just fills the vertical canvas; raise it to push in further."
Dialog.Section.Focus="Focus"
Dialog.FocusEnable="Highlight the area around the cursor (dim and/or blur the rest)"
Dialog.FocusEnableTooltip="While zoomed, darkens the scene around a soft spotlight that follows the cursor. Sources that are not ticked on the Sources tab (a webcam, a logo) stay above the dimming and are not darkened."
Dialog.FocusDim="Dim strength"
Dialog.FocusDimTooltip="How dark the area outside the spotlight gets."
Dialog.FocusRadius="Spotlight radius"
Dialog.FocusRadiusTooltip="Size of the light beam around the cursor while zoomed: the distance at which the light has faded to half. The shape of the fade is set by Light cone."
Dialog.FocusIdleRadius="Beam size (not zoomed)"
Dialog.FocusIdleRadiusTooltip="Size of the light beam around the cursor (the distance at which the light has faded to half) while the view is not zoomed. While zooming it eases to the zoomed beam (Spotlight radius). Only used with Show focus when not zoomed."
Dialog.FocusCone="Light cone"
Dialog.FocusConeTooltip="Shape of the light beam (its size is Spotlight radius). The light is brightest at the cursor and fades continuously, like a flashlight. Lower: a crisp, concentrated beam with a hard edge. Higher: light that spreads more gently and softly."
Dialog.Section.Frame="Frame"
Dialog.FrameEnable="Frame the captured screen (coloured background and glowing border)"
Dialog.FrameEnableTooltip="Colours the area the captured screen does not cover and draws a glowing border along the screen's own edges. The border follows the screen while it zooms and pans (best together with Centre focus). Sources that are not ticked on the Sources tab (a webcam, a logo) stay on top of the frame."
Dialog.FrameColor="Border / glow colour"
Dialog.FrameColorTooltip="Colour of the border and its glow."
Dialog.FrameBg="Background colour"
Dialog.FrameBgTooltip="Colour that fills the black area around the captured screen."
Dialog.FrameBgMode="Background style"
Dialog.FrameBgMode.Solid="Solid colour"
Dialog.FrameBgMode.Linear="Linear gradient"
Dialog.FrameBgMode.Radial="Radial gradient (centre to edges)"
Dialog.FrameBgModeTooltip="Solid fills the background with one colour. Gradients blend from the background colour to the second colour."
Dialog.FrameBg2="Gradient end colour"
Dialog.FrameBg2Tooltip="Second colour of the gradient: the far end for linear, the outer edges for radial."
Dialog.FrameBgAngle="Gradient angle"
Dialog.FrameBgAngleTooltip="Direction of the linear gradient. 0 = left to right, 90 = top to bottom."
Dialog.FrameBorder="Border width"
Dialog.FrameBorderTooltip="Thickness of the solid border. 0 leaves only the glow."
Dialog.FrameRadius="Corner radius"
Dialog.FrameRadiusTooltip="How round the corners of the captured screen's border are. 0 keeps them square."
Dialog.FrameGlow="Glow size"
Dialog.FrameGlowTooltip="How far the glow spreads outside the border. 0 turns the glow off."
Dialog.FrameGlowStrength="Glow strength"
Dialog.FrameGlowStrengthTooltip="Brightness of the glow next to the border."
Dialog.PickFrameColor="Pick colour"
Dialog.FocusStyle="Focus style"
Dialog.FocusStyleTooltip="Dim: darken the area outside the spotlight. Blur: blur it so the eye goes to the cursor. Blur + Dim: both. If the blur shader is not installed, Dim is used instead."
Dialog.FocusStyle.Dim="Dim"
Dialog.FocusStyle.Blur="Blur"
Dialog.FocusStyle.BlurDim="Blur + Dim"
Dialog.FocusBlur="Blur strength"
Dialog.FocusBlurTooltip="How blurry the area outside the spotlight gets, measured on the canvas. Very high values are capped for quality."
Dialog.Section.CamRing="Webcam ring"
Dialog.CamRingEnable="Round webcam with a glowing ring"
Dialog.CamRingEnableTooltip="Turns the chosen camera source (a phone camera through DroidCam, a webcam) into a circle with a ring and a soft glow. Move and resize it in OBS as usual. Leave it unticked on the Sources tab so it stays fixed while the screen zooms; it still grows or shrinks with the zoom."
Dialog.CamSource="Webcam source"
Dialog.CamSourceTooltip="The camera source to turn into a circle. Pick it after adding it to OBS, then press Refresh Lists if it is not in the list."
Dialog.CamSourceNone="(none)"
Dialog.CamColor="Ring colour"
Dialog.CamColorTooltip="Colour of the ring and its glow."
Dialog.CamRing="Ring width"
Dialog.CamRingTooltip="Thickness of the solid ring. 0 leaves only the glow."
Dialog.CamGlow="Glow size"
Dialog.CamGlowTooltip="How far the glow spreads outside the ring. 0 turns it off. The ring and glow take their room from the circle, so a large glow makes the circle smaller."
Dialog.CamGlowStrength="Glow strength"
Dialog.CamGlowStrengthTooltip="Brightness of the glow next to the ring."
Dialog.CamZoom="Size when zoomed"
Dialog.CamZoomTooltip="Size of the webcam at full zoom, as a percentage of its normal size. 100% keeps it the same, above 100% makes it grow when the screen zooms in, below 100% makes it shrink."
Dialog.SavePreset="Save my preset"
Dialog.SavePresetTooltip="Saves all settings as they are now. After you change something by accident, press the Reels preset button to bring them back. The target screen and the ticked sources are not part of the preset."
Dialog.PresetSaved="Your preset was saved. The Reels preset button now restores it."
Dialog.PresetSaveFailed="Could not save the preset."
Dialog.PresetRestored="Your saved preset was restored."
Dialog.Section.Sound="Sound effects"
Dialog.SoundEnable="Play sound effects (zoom in, zoom out, typing)"
Dialog.SoundEnableTooltip="Plays short sounds straight into the recording (they do not go through the speakers). Pick your own files with Browse; each is copied into the plugin's folder, so you can delete the original."
Dialog.SoundZoomIn="Zoom In sound"
Dialog.SoundZoomOut="Zoom Out sound"
Dialog.SoundTyping="Typing sound"
Dialog.SoundOnTooltip="Tick to play this sound. Untick to switch just this one off."
Dialog.SoundBrowse="Browse..."
Dialog.SoundDefault="Default"
Dialog.SoundDefaultTooltip="Go back to the built-in sound."
Dialog.SoundPlay="Play"
Dialog.SoundBuiltIn="(built-in sound)"
Dialog.SoundVolumeTooltip="Volume of this sound."
Dialog.SoundTypingMode="Typing sound style"
Dialog.SoundTypingMode.Tick="A tick for every key"
Dialog.SoundTypingMode.Loop="Continuous while typing"
Dialog.SoundTypingModeTooltip="A tick for every key suits slow typing; Continuous plays one steady sound for as long as you keep typing and suits fast typing."
Dialog.SoundBrowseTitle="Choose a sound file"
Dialog.SoundFilter="Audio files"
Dialog.SoundCopied="Sound copied and in use."
Dialog.SoundCopyFailed="Could not copy the sound file."
Dialog.WheelZoom="Zoom with mouse wheel"
Dialog.WheelZoomTooltip="Hold the key below and scroll the wheel: up zooms in (and goes deeper), down zooms back out. Scrolling down to 1x zooms out completely. Windows only."
Dialog.WheelModifier="Hold key"
Dialog.WheelMod.Alt="Alt"
Dialog.WheelMod.Ctrl="Ctrl"
Dialog.WheelMod.Shift="Shift"
Dialog.WheelStep="Step per notch"
Dialog.WheelMax="Max zoom"
Dialog.WheelExit="Zoom-out to exit"
Dialog.WheelExitOff="Off"
Dialog.WheelExitTooltip="How much you can scroll out (in zoom units) from the current zoom before it jumps back to the full unzoomed screen. Off = only when fully zoomed out."
Dialog.IdleFollowX="Follow the mouse sideways when not zoomed"
Dialog.IdleFollowXTooltip="For a wide capture on a narrow (vertical) canvas: when not zoomed, the capture slides left and right so the mouse stays in view. Zooming in continues smoothly from there."
Dialog.FitScreen="Fit screen to canvas"
Dialog.FitScreenTooltip="Vertical canvas (e.g. 1080x1920): scales the captured screen to the canvas width, centred vertically. Horizontal canvas (e.g. 1920x1080): fits the whole screen inside the canvas, centred, so a 1080p screen stays 1:1. Shows the whole screen when not zoomed. Also done by the Reels preset button. You can undo it with Ctrl+Z in OBS."
Dialog.FitScreenDone="Screen fitted to the canvas."
Dialog.SaveLayout="Save layout as default"
Dialog.SaveLayoutTooltip="Arrange the screen in the canvas the way you want it when not zoomed (size and position), then press the button for the current canvas size: vertical for 1080x1920, horizontal for 1920x1080. \"Fit screen to canvas\" and the Reels preset button bring that layout back whenever the canvas has that size. Without a saved layout the automatic fit is used."
Dialog.SaveLayoutDone="Layout saved for the %1x%2 canvas. Fit screen to canvas will restore it."
Dialog.SaveLayoutNone="Nothing to save: no target source found in the current scene."
Dialog.SaveLayoutVertical="Save vertical layout (1080×1920)"
Dialog.SaveLayoutHorizontal="Save horizontal layout (1920×1080)"
Dialog.SaveLayoutWrongCanvas="The canvas is not %1x%2 right now. Change the canvas size in OBS (Settings > Video), arrange the screen, then press this again."
Dialog.Tab.Presets="Presets"
Dialog.Presets.Intro="Presets for vertical videos (1080×1920 canvas) and horizontal videos (1920×1080 canvas). Press + to add as many as you like and give each one a name. Save stores every setting plus where the screen sits in the canvas; Restore brings them back, and puts the screen back in its place. The screen layout is remembered per canvas size, so presets of the same orientation share it."
Dialog.Presets.Vertical="Vertical preset (1080×1920)"
Dialog.Presets.Horizontal="Horizontal preset (1920×1080)"
Dialog.Presets.VerticalHelp="For Reels / Shorts / TikTok. Until you save your own, Restore uses: automatic zoom on click and typing, punch animation, Portrait cover, cursor halo, and fits the whole screen into the canvas."
Dialog.Presets.HorizontalHelp="For normal wide videos. Until you save your own, Restore uses: automatic zoom on click and typing, punch animation, zoom 2.0x, no portrait cover, cursor halo, and fits the screen 1:1 into the canvas."
Dialog.Presets.Add="+ Add preset"
Dialog.Presets.AddTooltip="Adds a new preset in this section with a snapshot of all current settings. Give it a name in the box next to it."
Dialog.Presets.NewName="Preset %1"
Dialog.Presets.NameTooltip="The preset's name. You can type any title."
Dialog.Presets.DeleteMainTooltip="The main preset cannot be deleted."
Dialog.Presets.Delete="Delete"
Dialog.Presets.DeleteTooltip="Deletes this preset (your other settings are not touched)."
Dialog.Presets.DeleteConfirm="Delete the preset \"%1\"?"
Dialog.Presets.Added="Preset \"%1\" added with the current settings. Rename it if you like."
Dialog.Presets.Deleted="Preset \"%1\" deleted."
Dialog.Presets.Restore="Restore"
Dialog.Presets.RestoreTooltip="Brings back the settings you saved for this preset (or the built-in ones if you have not saved yet), and puts the screen back in its saved place. The target screen and ticked sources are kept."
Dialog.Presets.Save="Save"
Dialog.Presets.SaveTooltip="Saves all current settings for this preset. If the OBS canvas has this preset's size, the screen's current size and position are saved as well."
Dialog.Presets.Fit="Fit screen"
Dialog.Presets.FitTooltip="Puts the screen into the canvas now: your saved layout for this canvas size, or the automatic fit if none is saved. You can undo it with Ctrl+Z in OBS."
Dialog.Presets.Saved="%1 saved."
Dialog.Presets.SavedLayout="Screen layout saved too."
Dialog.Presets.LayoutSkipped="The OBS canvas is not %1x%2 right now, so the screen layout was left alone (change it in OBS Settings > Video)."
Dialog.Presets.WrongCanvas="The OBS canvas is not %1x%2 right now. Change it in OBS (Settings > Video) first."
Dialog.Presets.Restored="Preset restored."
Dialog.Presets.AppliedVertical="Vertical preset applied (built-in settings). Zoom Factor 1.0 means the capture just fills the canvas; raise it to push in further."
Dialog.Presets.AppliedHorizontal="Horizontal preset applied (built-in settings)."
Dialog.Backup.Title="Backup"
Dialog.Backup.Help="Export saves all your settings, both presets and your saved screen layouts into one file. Import loads such a file, for example on another computer. The target screen and ticked sources are not included, they stay as set on each computer."
Dialog.Backup.Export="Export settings…"
Dialog.Backup.ExportTooltip="Saves all settings, both presets and the saved layouts to a .json file."
Dialog.Backup.Import="Import settings…"
Dialog.Backup.ImportTooltip="Loads a settings file made with Export. The current settings are replaced; the target screen and ticked sources stay."
Dialog.Backup.Exported="Settings exported to %1"
Dialog.Backup.Imported="Settings imported."
Dialog.Backup.Failed="Could not read or write the settings file."
