Dialog.Section.CursorHalo="Cursor Halo"
Dialog.Section.Tilt3d="3D camera"
Dialog.Tilt3dHelp="The captured screen leans in 3D towards the mouse: move the mouse to the right and the screen turns so that side moves away, like a camera looking at it from the side. It follows the mouse smoothly, zoomed or not."
Dialog.Tilt3d="Enable 3D camera"
Dialog.Tilt3dTooltip="Adds a 3D tilt filter to the captured screen. Turning this off removes it again."
Dialog.Tilt3dX="Turn left / right"
Dialog.Tilt3dXTooltip="How many degrees the screen turns around its vertical axis when the mouse is at the left or right edge."
Dialog.Tilt3dY="Turn up / down"
Dialog.Tilt3dYTooltip="How many degrees the screen turns around its horizontal axis when the mouse is at the top or bottom edge."
Dialog.Tilt3dPersp="Camera distance"
Dialog.Tilt3dPerspTooltip="How far the camera is, in multiples of the screen's longer side. Small = strong perspective, large = flatter."
Dialog.Tilt3dInZoom="Keep 3D while zoomed"
Dialog.Tilt3dInZoomTooltip="Keeps the 3D turn while zoomed in. Near the edges and corners of the screen it fades only as far as needed so the screen's real edges and corners still show exactly; away from the edges it stays full. Untick for a flat picture while zoomed (the turn fades out by 1.5x zoom)."
Dialog.Tilt3dInvert="Invert direction (the mouse side comes towards the camera)"
Dialog.Tilt3dInvertTooltip="By default the side the mouse is on moves away from you. Tick this to make it come closer."
Dialog.Section.Developer="Developer"
Dialog.ZoomFactor="Zoom Factor"
Dialog.ZoomFactorTooltip="Values > 1 zoom in. Set to 0 or 1 to follow-only."
Dialog.WheelZoomInStep="Wheel Zoom In Sensitivity"
Dialog.WheelZoomOutStep="Wheel Zoom Out Sensitivity"
Dialog.WheelZoomMinimum="Minimum Zoom"
Dialog.WheelZoomMaximum="Maximum Zoom"
Dialog.AnimateIn="Animate In"
Dialog.AnimateOut="Animate Out"
Dialog.Enable="Enable"
Dialog.FollowMouse="Follow Mouse"
Dialog.FollowTooltip="Follow the cursor while it stays inside the captured region."
Dialog.ZoomAnchor="Zoom Anchor"
Dialog.ZoomAnchor.CursorStatic="Cursor position (static)"
Dialog.ZoomAnchor.CursorFollow="Cursor position (follow)"
Dialog.ZoomAnchorTooltip="Static zooms around wherever the cursor was when the zoom was triggered, then holds still. Follow keeps tracking the cursor while it stays inside the captured region."
Dialog.SmoothingSpeed="Smoothing Speed"
Dialog.CenterCursorUntilEdge="Keep cursor centered until the capture reaches an edge"
Dialog.CenterCursorUntilEdgeTooltip="Maps the full captured monitor to the full captured scene content, which improves ultrawide tracking and clamps only when an edge is reached."
Dialog.CenterFocus="Always keep the zoomed area in the center of the video"
Dialog.CenterFocusTooltip="While zoomed, the point you are working on (the mouse, or the text caret while typing) stays exactly in the middle of the frame. Near the edges of the screen this shows empty space beside the capture."
Dialog.EdgeOverflowMargin="Edge Overflow Margin"
Dialog.EdgeOverflowMarginTooltip="Allows the canvas to overflow outside the screen borders when moving near edges. 0% locks at screen boundaries, 50% keeps the cursor centered at 50%, and intermediate percentages allow partial border overflow."
Dialog.EdgeOverflow.Disabled="0% (Locked at edges)"
Dialog.MouseIdleTimeout="Pause following after idle"
Dialog.MouseIdleTimeoutTooltip="Freeze the current view after the mouse has not moved for this long. Following resumes when the mouse moves."
Dialog.Disabled="Disabled"
Dialog.PortraitCover="Portrait cover, auto-scale to fill vertical canvases"
Dialog.PortraitCoverHelp="For vertical canvases (e.g. 1080x1920). ON: when you zoom, the capture is first enlarged until it fills the whole canvas height (no empty bands above and below), and Zoom Factor is applied on top of that, so the view gets very large. OFF: zoom is exactly the Zoom Factor, relative to the fitted screen; empty bands may show above and below."
Dialog.PortraitCoverTooltip="When the canvas is taller than wide, scale the capture while zoomed so it fills the canvas with no top / bottom gaps, and keep the view centred on the cursor. Zoom Factor is applied on top of that."
Dialog.ShowCursorHalo="Show click halo"
Dialog.ShowCursorHaloTooltip="Flash a halo at the click position while zoomed."
Dialog.ShowHaloWhenNotZoomed="Show halo when not zoomed"
Dialog.ShowHaloWhenNotZoomedTooltip="Also show click halos while the zoom effect is inactive."
Dialog.ShowOnlyOnClick="Show only on click"
Dialog.ShowOnlyOnClickTooltip="When enabled, the halo flashes at the click position instead of following the cursor continuously."
Dialog.HaloIdleSize="Halo Size (not zoomed)"
Dialog.HaloIdleSizeTooltip="Size of the click halo while the view is not zoomed. Only used with Show halo when not zoomed."
Dialog.HaloSize="Halo Size"
Dialog.RingThickness="Ring Thickness"
Dialog.Color="Color"
Dialog.EnableDebugLogging="Enable debug logging"
Dialog.SourcesHelp="<b>Check</b> sources to include in the zoom effect.<br><b>Unchecked</b> sources stay fixed, such as a camera overlay or a watermark.<br>New sources are unchecked until you opt them in."
Dialog.StatusTip="Tip: Select the monitor that should drive the scene movement."
Dialog.RefreshLists="Refresh Lists"
Dialog.Apply="Apply"
Dialog.Test="Test"
Dialog.SettingsApplied="Settings applied."
Dialog.TestStatus="Use your configured trigger to test zoom."
Dialog.PickCursorHaloColor="Pick Cursor Halo Color"

