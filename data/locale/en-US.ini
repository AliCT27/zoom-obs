Dialog.FollowTooltip="Follow the cursor while it stays inside the captured region."
Dialog.ZoomAnchor="Zoom Anchor"
Dialog.ZoomAnchor.Center="Canvas center"
Dialog.ZoomAnchor.CursorStatic="Cursor position (static)"
Dialog.ZoomAnchor.CursorFollow="Cursor position (follow)"
Dialog.ZoomAnchorTooltip="Canvas center ignores the cursor. Static zooms around wherever the cursor was when the zoom was triggered, then holds still. Follow keeps tracking the cursor while it stays inside the captured region."
Dialog.SmoothingSpeed="Smoothing Speed"
Dialog.CenterCursorUntilEdge="Keep cursor centered until the capture reaches an edge"
Dialog.CenterCursorUntilEdgeTooltip="Maps the full captured monitor to the full captured scene content, which improves ultrawide tracking and clamps only when an edge is reached."
Dialog.CenterFocus="Always keep the zoomed area in the center of the video"
Dialog.CenterFocusTooltip="While zoomed, the point you are working on (the mouse, or the text caret while typing) stays exactly in the middle of the frame. Near the edges of the screen this shows empty space beside the capture."
Dialog.EdgeOverflowMargin="Edge Overflow Margin"
Dialog.EdgeOverflowMarginTooltip="Allows the canvas to overflow outside the screen borders when moving near edges. 0% locks at screen boundaries, 50% keeps the cursor centered at 50%, and intermediate percentages allow partial border overflow."
Dialog.EdgeOverflow.Disabled="0% (Locked at edges)"
Dialog.MouseIdleTimeout="Pause following after idle"
Dialog.MouseIdleTimeoutTooltip="Freeze the current view after the mouse has not moved for this long. Following resumes when the mouse moves."
Dialog.Disabled="Disabled"
Dialog.PortraitCover="Portrait cover, auto-scale to fill vertical canvases"
Dialog.PortraitCoverTooltip="When the canvas is taller than wide, scale the capture while zoomed so it fills the canvas with no top / bottom gaps, and keep the view centred on the cursor. Zoom Factor is applied on top of that."
Dialog.ShowCursorHalo="Show click halo"
Dialog.ShowCursorHaloTooltip="Flash a halo at the click position while zoomed."
Dialog.ShowHaloWhenNotZoomed="Show halo when not zoomed"
Dialog.ShowHaloWhenNotZoomedTooltip="Also show click halos while the zoom effect is inactive."
Dialog.ShowOnlyOnClick="Show only on click"
Dialog.ShowOnlyOnClickTooltip="When enabled, the halo flashes at the click position instead of following the cursor continuously."
Dialog.HaloSize="Halo Size"
Dialog.RingThickness="Ring Thickness"
Dialog.Color="Color"
Dialog.EnableDebugLogging="Enable debug logging"
Dialog.SourcesHelp="<b>Check</b> sources to include in the zoom effect.<br><b>Unchecked</b> sources stay fixed, such as a camera overlay or a watermark.<br>New sources are unchecked until you opt them in."
Dialog.StatusTip="Tip: Select the monitor that should drive the scene movement."
Dialog.RefreshLists="Refresh Lists"
Dialog.Apply="Apply"
Dialog.Test="Test"
Dialog.SettingsApplied="Settings applied."
Dialog.TestStatus="Use your configured trigger to test zoom."
